<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="project.css" />
  </head>
  <body>
    <h1 class="title">COUNTER APP</h1>

    <div class="container">
      <h1 class="number">0</h1>

      <div class="btn-container">
        <button type="button" class="btn" id="btn-increase">+</button>
        <button type="button" class="btn" id="btn-decrease">-</button>
      </div>

      <div class="btn-container">
        <button type="button" class="btn" id="btn-increase-ten">+10</button>
        <button type="button" class="btn" id="btn-reset">reset</button>
        <button type="button" class="btn" id="btn-decrease-ten">-10</button>
      </div>
    </div>

    <script src="project.js"></script>
  </body>
</html>
